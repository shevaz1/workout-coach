<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>운동 코치</title>
<meta name="description" content="헬스를 처음 시작하는 사람을 위한 기구 운동 코치">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="운동 코치">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f4f6f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1116" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<style>
:root{--bg:#f4f6f9;--card:#fff;--ink:#131820;--mut:#566070;--line:#dfe4ea;--acc:#1d5fd6;--acc-ink:#fff;--soft:#e7eefc;--mach:#a9b2bf;--ok:#16794a;--warn:#a34b00;--warnbg:#fff3e2;--danger:#c0392b}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1116;--card:#1a1f27;--ink:#f1f4f8;--mut:#a3adba;--line:#2c3440;--acc:#6aa5ff;--acc-ink:#071225;--soft:#1c2a44;--mach:#5d6877;--ok:#4cc38a;--warn:#ffb866;--warnbg:#33260f;--danger:#ff7b6b}}
:root[data-theme=dark]{--bg:#0e1116;--card:#1a1f27;--ink:#f1f4f8;--mut:#a3adba;--line:#2c3440;--acc:#6aa5ff;--acc-ink:#071225;--soft:#1c2a44;--mach:#5d6877;--ok:#4cc38a;--warn:#ffb866;--warnbg:#33260f;--danger:#ff7b6b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;word-break:keep-all;overflow-wrap:anywhere;touch-action:manipulation}
main{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 96px)}
main.nonav{padding-bottom:calc(env(safe-area-inset-bottom) + 120px)}
h1{font-size:28px;margin:8px 0 12px;line-height:1.25}
h2{font-size:20px;margin:0 0 8px;line-height:1.3}
h2 small,h3 small{font-weight:400;color:var(--mut);font-size:14px}
h3{font-size:16px;margin:18px 0 8px}
p{margin:6px 0}
.muted{color:var(--mut);font-size:15px}.center{text-align:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}
.card.hero{border-color:var(--acc)}
.tag{display:inline-block;font-size:13px;font-weight:600;background:var(--soft);color:var(--ink);border-radius:999px;padding:2px 10px;vertical-align:middle}
button,select,input{font:inherit;color:inherit}
.btn{display:block;width:100%;min-height:54px;margin:10px 0 0;padding:10px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-weight:600;cursor:pointer;line-height:1.25}
.btn small{display:block;font-weight:400;font-size:13px;color:var(--mut);margin-top:2px}
.btn.big{min-height:66px;font-size:21px;background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.btn.ghost{background:transparent;color:var(--mut)}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.4}
.btn:active,.chip:active,.stepper button:active{transform:scale(.98)}
.link{background:none;border:0;color:var(--mut);padding:10px 4px;font-size:16px;cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{background:var(--card);border:1px solid var(--line);border-radius:12px;text-align:center;padding:6px 0;font-size:14px;color:var(--mut)}
.wd b{display:block;height:22px;font-size:16px;color:var(--mut)}
.wd.today{border:2px solid var(--ink);color:var(--ink);font-weight:700}
.wd.done b{color:var(--ok)}.wd.plan b{color:var(--acc);font-size:12px;line-height:22px}
.legend{font-size:13px;color:var(--mut);margin:6px 2px}
.sw{display:inline-block;width:14px;height:6px;border-radius:3px;margin:0 4px 1px 6px}.sw.move{background:var(--acc)}.sw.mach{background:var(--mach)}
.list{list-style:none;margin:10px 0 0;padding:0}
.list a{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);color:inherit;text-decoration:none;min-height:60px}
.list .n{width:30px;height:30px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-weight:700;font-size:15px;flex:none}
.list .g{flex:1;min-width:0}.list .g b{display:block;line-height:1.3}.list small{color:var(--mut);font-size:14px}
.list .w{font-weight:700;font-size:19px;white-space:nowrap}
.swap,.note{font-size:14px;background:var(--soft);border-radius:10px;padding:8px 12px;margin:10px 0 0}
.note{font-size:15px;margin:10px 0}
.warn{font-size:15px;background:var(--warnbg);color:var(--warn);border-radius:10px;padding:8px 12px;margin:10px 0 0}
.safe{font-size:14px;color:var(--mut);margin:16px 4px;text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:50px;min-width:50px;padding:8px 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-weight:600;cursor:pointer}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.num{display:block;position:relative}.num span{display:block;font-size:14px;font-weight:600;margin-bottom:4px}
.num input{width:100%;height:52px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);padding:0 34px 0 10px;font-size:19px;font-weight:600}
.num input.bad{border:2px solid var(--warn)}
.num em{position:absolute;right:10px;bottom:13px;font-style:normal;font-size:14px;color:var(--mut)}
.bwrow{display:grid;grid-template-columns:1fr 100px;gap:10px;align-items:end}.bwrow .btn{margin:0;min-height:52px}
.sel{width:100%;height:52px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);padding:0 10px;font-weight:600}
.figs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 0}
.figs figure{margin:0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px 4px 6px;text-align:center}
.figs svg{display:block;width:100%;height:auto;max-height:34vh}
.figs figcaption{font-size:14px;font-weight:700}
.figs line,.figs polyline,.figs path,.figs polygon{fill:none;stroke-linecap:round;stroke-linejoin:round}
.mach{stroke:var(--mach)}.mach.fill{fill:var(--mach);stroke:none}
.move{stroke:var(--acc)}.move.fill{fill:var(--acc);stroke:none}
.halo{stroke:var(--card)}.body{stroke:var(--ink)}.body.fill{fill:var(--ink)}circle.body.fill{stroke:none}
.arr{stroke:var(--acc);stroke-width:2.5;stroke-dasharray:1 5}polygon.arr.fill{fill:var(--acc);stroke-width:1;stroke-dasharray:none}
.how{margin:8px 0;padding-left:24px}.how li{margin:5px 0}
.setup,.mistake{font-size:16px}.setup b,.mistake b{display:inline-block;font-size:13px;background:var(--soft);border-radius:6px;padding:1px 8px;margin-right:4px}
.mistake b{background:var(--warnbg);color:var(--warn)}
.rule,.meal,.cool{margin:6px 0;padding-left:20px}.rule li,.meal li,.cool li{margin:5px 0}.cool b{display:block}
.wtop{display:flex;justify-content:space-between;align-items:center;color:var(--mut);font-weight:600}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden}.prog i{display:block;height:100%;background:var(--acc);border-radius:3px}
.exname{text-align:center;margin:14px 0 0;font-size:27px}
.setbox h2{text-align:center;font-size:24px}
.wbody{display:flex;flex-direction:column}
@media (max-height:760px){.wbody .setbox{order:-1;margin-top:10px}.wbody .setbox h2{margin:0 0 4px}.wbody .stepper{margin:6px 0}}
.stepper{display:grid;grid-template-columns:72px 1fr 72px;align-items:center;margin:10px 0;text-align:center}
.stepper button{height:64px;border-radius:16px;border:1.5px solid var(--line);background:var(--bg);font-size:30px;font-weight:700;cursor:pointer}
.stepper b{font-size:40px;line-height:1;font-variant-numeric:tabular-nums}.stepper small{font-size:17px;color:var(--mut);margin-left:4px}
.dock{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(env(safe-area-inset-bottom) + 12px);background:linear-gradient(transparent,var(--bg) 28%);z-index:5}
.dock .btn{max-width:528px;margin:0 auto}
.feel{display:grid;gap:4px}
.rest{position:fixed;inset:0;z-index:10;background:var(--bg);display:flex;flex-direction:column;justify-content:center;padding:calc(env(safe-area-inset-top) + 16px) 20px calc(env(safe-area-inset-bottom) + 16px);text-align:center;overflow:auto}
.rest>*{max-width:520px;width:100%;margin-left:auto;margin-right:auto}
.rl{font-size:20px;color:var(--mut);font-weight:600}
.rnum{font-size:112px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;color:var(--acc)}
.next{font-size:18px;color:var(--mut);margin:18px auto}.next b{font-size:28px;color:var(--ink)}
.calib .btn{text-align:left}.rest h2{margin-top:16px}
.stats{display:flex;justify-content:space-around;text-align:center;margin:6px 0 10px}
.stats b{display:block;font-size:36px;line-height:1.15;font-variant-numeric:tabular-nums}.stats small{color:var(--mut);font-size:14px}
.total{font-weight:700;border-top:1px solid var(--line);padding-top:10px;margin-top:12px}
.chart{display:block;width:100%;height:auto;margin-top:8px}
.chart .grid{stroke:var(--line);stroke-width:1}.chart .axis{stroke:var(--mut);stroke-width:1}
.chart .tick{fill:var(--mut);font-size:11px}.chart .val{fill:var(--ink);font-size:13px;font-weight:700}
.chart .bar{fill:var(--acc);opacity:.55}.chart .bar.on{opacity:1}
.chart .line{fill:none;stroke:var(--acc);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .dot{fill:var(--acc);stroke:var(--card);stroke-width:2}
.chart .hit{fill:transparent;cursor:pointer}
.sess{border-top:1px solid var(--line);padding:10px 0}.sess summary{font-weight:600;cursor:pointer;min-height:32px}.sess ul{margin:6px 0;padding-left:20px;font-size:15px;color:var(--mut)}
.tabs{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
.tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:62px;color:var(--mut);text-decoration:none;font-size:13px;font-weight:600}
.tabs i{font-style:normal;font-size:22px;line-height:1.2;filter:grayscale(1);opacity:.6}
.tabs a.on{color:var(--ink)}.tabs a.on i{filter:none;opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<noscript><p style="padding:24px">이 앱은 자바스크립트를 켜야 열립니다.</p></noscript>
<input id="file" type="file" accept="application/json,.json" hidden>
<script src="data.js"></script>
<script src="logic.js"></script>
<script src="app.js"></script>
</body>
</html>
